<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSphere - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         Header
    ========================== -->

    <header>

        <nav class="navbar">

            <div class="logo">
                BlogSphere
            </div>


            <button
                class="menu-toggle"
                id="menuToggle"
            >
                ☰
            </button>


            <ul
                class="nav-links"
                id="navLinks"
            >

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="blogs.html">
                        Blogs
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

                <li>
                    <a href="register.html">
                        Register
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================
         Main Content
    ========================== -->

    <main>

        <section class="auth-section">

            <div class="auth-container">

                <h1>
                    Welcome Back
                </h1>


                <p class="auth-subtitle">
                    Login to continue to your
                    BlogSphere account.
                </p>


                <!-- Login Form -->

                <form id="loginForm">


                    <!-- Email -->

                    <div class="form-group">

                        <label for="login-email">
                            Email Address
                        </label>


                        <input
                            type="email"
                            id="login-email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="login-password">
                            Password
                        </label>


                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="login-password"
                                placeholder="Enter your password"
                                required
                            >


                            <button
                                type="button"
                                class="toggle-password"
                                id="toggleLoginPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="auth-btn"
                    >
                        Login
                    </button>


                </form>


                <!-- Register Link -->

                <p class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>


            </div>

        </section>

    </main>


    <!-- =========================
         Footer
    ========================== -->

    <footer>

        <p>
            © 2026 BlogSphere. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
