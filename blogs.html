<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BlogSphere - Blogs</title>

<link
    rel="stylesheet"
    href="css/style.css"
>
```

</head>

<body>

```
<!-- Navigation Bar -->

<header>

    <nav class="navbar">

        <div class="logo">
            BlogSphere
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="blogs.html">
                    Blogs
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- Blogs Section -->

<main>

    <section class="blogs-section">


        <h1 class="page-title">
            Explore Blogs
        </h1>


        <p class="page-description">

            Discover interesting stories, ideas, and knowledge
            shared by the BlogSphere community.

        </p>



        <!-- Blog Search and Filter -->

        <div class="blog-controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search blogs..."
            >


            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="technology">
                    Technology
                </option>

                <option value="programming">
                    Programming
                </option>

                <option value="education">
                    Education
                </option>

                <option value="career">
                    Career
                </option>

                <option value="web development">
                    Web Development
                </option>

                <option value="lifestyle">
                    Lifestyle
                </option>

            </select>

        </div>



        <!-- Blogs Loaded From Backend -->

        <div
            class="blog-container"
            id="blogContainer"
        >

            <p id="loadingMessage">
                Loading blogs...
            </p>

        </div>


    </section>

</main>



<!-- Footer -->

<footer>

    <p>
        © 2026 BlogSphere. All Rights Reserved.
    </p>

</footer>



<script src="js/script.js"></script>
```

</body>

</html>
