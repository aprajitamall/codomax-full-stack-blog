<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>BlogSphere - Blog Details</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<!-- Navigation Bar -->
<header>
    <nav class="navbar">

        <div class="logo">
            BlogSphere
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="blogs.html">Blogs</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="register.html">Register</a>
            </li>

        </ul>

    </nav>
</header>


<!-- Blog Details -->

<main>

    <article class="blog-details">

        <span class="category" id="blogCategory">
            Loading...
        </span>

        <h1 id="blogTitle">
            Loading blog...
        </h1>

        <div class="blog-meta">

            <span>
                By <span id="blogAuthor">Loading...</span>
            </span>

            <span>•</span>

            <span id="blogDate">
                Loading...
            </span>

        </div>


        <div class="blog-content" id="blogContent">

            <p>
                Loading blog content...
            </p>

        </div>


        <a href="blogs.html" class="back-btn">
            ← Back to Blogs
        </a>

    </article>

</main>


<!-- Footer -->

<footer>

    <p>
        © 2026 BlogSphere. All Rights Reserved.
    </p>

</footer>


<script>

    // =========================
    // Get Blog ID From URL
    // =========================

    const urlParams =
        new URLSearchParams(window.location.search);

    const blogId =
        urlParams.get("id");


    // =========================
    // HTML Elements
    // =========================

    const blogTitle =
        document.getElementById("blogTitle");

    const blogCategory =
        document.getElementById("blogCategory");

    const blogAuthor =
        document.getElementById("blogAuthor");

    const blogDate =
        document.getElementById("blogDate");

    const blogContent =
        document.getElementById("blogContent");


    // =========================
    // Check Blog ID
    // =========================

    if (!blogId) {

        blogTitle.textContent =
            "Blog Not Found";

        blogCategory.textContent =
            "Error";

        blogAuthor.textContent =
            "-";

        blogDate.textContent =
            "-";

        blogContent.innerHTML = `
            <p>
                No blog ID was provided.
            </p>
        `;

    } else {

        loadBlog(blogId);

    }


    // =========================
    // Load Blog
    // =========================

    async function loadBlog(id) {

        try {

            const response =
                await fetch(
                    `http://localhost:5000/api/blogs/${id}`
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message || "Blog not found"
                );

            }


            const blog =
                data.blog;


            // Blog title

            blogTitle.textContent =
                blog.title;


            // Category

            blogCategory.textContent =
                blog.category;


            // Author

            blogAuthor.textContent =
                blog.author;


            // Date

            const date =
                new Date(blog.createdAt);


            blogDate.textContent =
                date.toLocaleDateString(
                    "en-IN",
                    {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    }
                );


            // Content

            blogContent.innerHTML = "";


            const paragraphs =
                blog.content.split("\n");


            paragraphs.forEach(function (paragraph) {

                if (paragraph.trim() !== "") {

                    const p =
                        document.createElement("p");

                    p.textContent =
                        paragraph.trim();

                    blogContent.appendChild(p);

                }

            });


        } catch (error) {

            console.error(
                "Error loading blog:",
                error
            );


            blogTitle.textContent =
                "Unable to Load Blog";


            blogCategory.textContent =
                "Error";


            blogAuthor.textContent =
                "-";


            blogDate.textContent =
                "-";


            blogContent.innerHTML = `
                <p>
                    ${error.message}
                </p>

                <p>
                    Please make sure the backend
                    server is running.
                </p>
            `;

        }

    }

</script>


<script src="js/script.js"></script>
```

</body>

</html>
