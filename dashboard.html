<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSphere - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                BlogSphere
            </div>

            <button class="menu-toggle" id="menuToggle">
                ☰
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="create-blog.html">Create Blog</a></li>
                <li>
                    <a href="#" id="logoutLink">Logout</a>
                </li>
            </ul>

        </nav>
    </header>


    <!-- Dashboard -->
    <main>

        <section class="dashboard-section">

            <div class="dashboard-header">

                <div>
                    <h1>
                        Welcome, <span id="userName">User</span>!
                    </h1>

                    <p id="userEmail">
                        Manage your blogs and create new stories.
                    </p>
                </div>

                <a href="create-blog.html" class="btn">
                    + Create Blog
                </a>

            </div>


            <!-- Dashboard Statistics -->
            <div class="stats-container">

                <div class="stat-card">
                    <h3>Total Blogs</h3>
                    <p id="totalBlogs">0</p>
                </div>

                <div class="stat-card">
                    <h3>Published</h3>
                    <p id="publishedBlogs">0</p>
                </div>

                <div class="stat-card">
                    <h3>Drafts</h3>
                    <p id="draftBlogs">0</p>
                </div>

            </div>


            <!-- My Blogs -->
            <div class="my-blogs">

                <h2>My Blogs</h2>

                <div
                    class="blog-container"
                    id="dashboardBlogContainer"
                >
                    <p>Loading your blogs...</p>
                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 BlogSphere. All Rights Reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
